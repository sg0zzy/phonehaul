name: Beta Release
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Committed branch/SHA already reviewed on main'
        type: string
        required: true
        default: main
permissions:
  contents: read
concurrency:
  group: official-release-lifecycle
  cancel-in-progress: false
jobs:
  allocate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.allocate.outputs.version }}
      dev-n: ${{ steps.allocate.outputs.dev-n }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - name: Resolve once and verify reviewed source ancestry
        id: resolve
        env:
          SOURCE_SELECTOR: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SELECTOR" =~ ^[A-Za-z0-9_./-]+$ && "$SOURCE_SELECTOR" != -* ]]
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SELECTOR" --jq '.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin "$sha"
          git merge-base --is-ancestor "$sha" origin/main
          echo "commit=$sha" >> "$GITHUB_OUTPUT"
          echo "Resolved $SOURCE_SELECTOR to $sha (reviewed main history)" >> "$GITHUB_STEP_SUMMARY"
      - name: Reserve immutable beta tag
        id: allocate
        env:
          SOURCE_SHA: ${{ steps.resolve.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          version="$(scripts/beta-version.sh allocate "$SOURCE_SHA")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dev-n=${version#*-dev.}" >> "$GITHUB_OUTPUT"
  builds:
    needs: allocate
    permissions:
      contents: read
    uses: ./.github/workflows/platform-builds.yml
    with:
      ref: ${{ needs.allocate.outputs.commit }}
      official: false
      release: true
      dev-n: ${{ needs.allocate.outputs.dev-n }}
  android-signed:
    needs: allocate
    uses: ./.github/workflows/android-signed-release.yml
    with:
      ref: v${{ needs.allocate.outputs.version }}
    secrets: inherit
  stage:
    if: ${{ !cancelled() && needs.allocate.result == 'success' && needs.builds.result == 'success' }}
    needs: [allocate, builds, android-signed]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.allocate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets
      - name: Verify all mandatory targets and transport hashes
        env:
          RELEASE_VERSION: ${{ needs.allocate.outputs.version }}
        run: scripts/assemble-release-assets.sh "$RELEASE_VERSION" release-assets assets-release
      - name: Generate notes and stage verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.allocate.outputs.version }}
        run: |
          scripts/release-notes.sh "$RELEASE_VERSION" RELEASE_NOTES.md
          node scripts/shared/publish-release.js "$RELEASE_VERSION" assets-release RELEASE_NOTES.md stage
          echo "Review draft notes and release-manifest.json before approving release-publication: https://github.com/$GITHUB_REPOSITORY/releases" >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: [stage, allocate]
    environment: release-publication
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.allocate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets
      - name: Verify all mandatory targets and transport hashes
        env:
          RELEASE_VERSION: ${{ needs.allocate.outputs.version }}
        run: scripts/assemble-release-assets.sh "$RELEASE_VERSION" release-assets assets-release
      - name: Confirm approval controls and publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.allocate.outputs.version }}
        run: |
          set -euo pipefail
          # Fail closed when the environment was auto-created without reviewers.
          gh api "repos/$GITHUB_REPOSITORY/environments/release-publication" --jq '.protection_rules | any(.type == "required_reviewers")' | grep -qx true
          PHONEHAUL_NOTES_REVIEWED=1 node scripts/shared/publish-release.js "$RELEASE_VERSION" assets-release RELEASE_NOTES.md
