name: Android signed release

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Tag/commit to build (empty = the run default).'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  android-release:
    name: Build signed APK and Play bundle
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      # Official stable builds come from a v* tag; CI validates tag, VERSION
      # and commit consistency and fails on disagreement (DEVELOPMENT_STANDARDS.md ).
      # A workflow_dispatch run is only accepted on the commit already tagged
      # v<core>, so an official identity is never built from untagged code
      #. The adapter derives versionName=X.Y.Z and the stable
      # versionCode slot.
      # A beta tag (vX.Y.Z-dev.N, pushed by the Beta release workflow) builds
      # the same signed identity with versionName=X.Y.Z-dev.N and dev slot N
      #: same release key as stable, but never uploaded to Play.
      - name: Validate official tagged source
        shell: bash
        env:
          SELECTED_REF: ${{ inputs.ref || github.ref }}
        run: |
          set -euo pipefail
          version="${SELECTED_REF#refs/tags/}"
          version="${version#v}"
          node scripts/shared/official.js validate "$version"
          git merge-base --is-ancestor HEAD origin/main
          if [[ "$version" == *-dev.* ]]; then
            echo "PHONEHAUL_OFFICIAL=0" >> "$GITHUB_ENV"
            echo "PHONEHAUL_DEV_N=${version#*-dev.}" >> "$GITHUB_ENV"
          else
            echo "PHONEHAUL_OFFICIAL=1" >> "$GITHUB_ENV"
          fi
          echo "PHONEHAUL_RELEASE=1" >> "$GITHUB_ENV"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_STORE_PASSWORD:?Missing ANDROID_STORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          keystore="$RUNNER_TEMP/phonehaul-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          key_check="$RUNNER_TEMP/phonehaul-signing-check.p12"
          key_check_log="$RUNNER_TEMP/phonehaul-signing-check.log"
          if ! keytool -importkeystore \
            -srckeystore "$keystore" \
            -srcstorepass:env ANDROID_STORE_PASSWORD \
            -srcalias "$ANDROID_KEY_ALIAS" \
            -srckeypass:env ANDROID_KEY_PASSWORD \
            -destkeystore "$key_check" \
            -deststoretype PKCS12 \
            -deststorepass:env ANDROID_STORE_PASSWORD \
            -destkeypass:env ANDROID_STORE_PASSWORD \
            -noprompt >"$key_check_log" 2>&1; then
            cat "$key_check_log"
            echo "Android signing check failed: verify the keystore file, alias, store password, and key password secrets."
            exit 1
          fi
          rm -f "$key_check" "$key_check_log"
          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
      - name: Build signed release APK and app bundle
        working-directory: android
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease
      - name: Verify final signing identity and package bytes
        env:
          ANDROID_SIGNER_SHA256: ${{ vars.ANDROID_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          : "${ANDROID_SIGNER_SHA256:?Declare the expected public APK signer SHA-256 first}"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/apk-signature.txt"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt")"
          [[ "${actual,,}" == "${ANDROID_SIGNER_SHA256,,}" ]] || { echo 'APK signer mismatch'; exit 1; }
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/aab-signature.txt"
          grep -q 'jar verified.' "$RUNNER_TEMP/aab-signature.txt"
          upload_actual="$(keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | sed -n 's/.*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')"
          [[ "$upload_actual" == "${ANDROID_SIGNER_SHA256,,}" ]] || { echo 'AAB upload signer mismatch'; exit 1; }
          node scripts/shared/ci-info.js android-signed 'android/app/build/outputs/apk/release/*.apk' 'android/app/build/outputs/bundle/release/*.aab'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: phonehaul-android-release
          path: ci-output/android-signed/
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary credentials
        if: always()
        run: rm -f -- "$RUNNER_TEMP/phonehaul-release.jks" "$RUNNER_TEMP/phonehaul-signing-check.p12" "$RUNNER_TEMP/phonehaul-signing-check.log"
