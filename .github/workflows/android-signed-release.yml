name: Android signed release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  android-release:
    name: Build signed APK and Play bundle
    runs-on: ubuntu-24.04
    environment: release
    env:
      # Optional: set PLAY_SERVICE_ACCOUNT_JSON in the `release` environment
      # to auto-upload the AAB to the Play internal track after a successful
      # tag build. Unset = artifact only (manual upload), so enabling this is
      # a pure config change. Promotion beyond internal stays manual
      # (VERSIONING.md §6.6: publication is a separate auditable action).
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@fbc6f3992d4b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      # Official builds come from a v* tag; CI validates tag, VERSION and
      # commit consistency and fails on disagreement (VERSIONING.md §6.2).
      # A workflow_dispatch run is only accepted on the commit already tagged
      # v<core>, so an official identity is never built from untagged code
      # (§6.5). The adapter derives versionName=X.Y.Z and the stable
      # versionCode slot (§8).
      - name: Validate release version (VERSIONING.md §6.2)
        shell: bash
        run: |
          set -euo pipefail
          core="$(node scripts/shared/version.js core)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [[ "$tag" != "$core" ]]; then
              echo "CI refuses: tag v${tag} disagrees with VERSION core ${core} (§6.2)." >&2
              exit 1
            fi
          else
            git fetch -q --no-tags origin "refs/tags/v${core}:refs/tags/v${core}" 2>/dev/null || true
            tagged="$(git rev-parse -q --verify "refs/tags/v${core}^{commit}" || true)"
            if [[ -z "$tagged" || "$tagged" != "$(git rev-parse HEAD)" ]]; then
              echo "CI refuses: untagged run; official builds must run on the commit tagged v${core} (§6.2/§6.5)." >&2
              echo "Tag with scripts/release.sh, or use the PhoneHaul builds workflow for dev APKs." >&2
              exit 1
            fi
          fi
          echo "PHONEHAUL_OFFICIAL=1" >> "$GITHUB_ENV"
          echo "version: ${core} (official)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_STORE_PASSWORD:?Missing ANDROID_STORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          keystore="$RUNNER_TEMP/phonehaul-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          key_check="$RUNNER_TEMP/phonehaul-signing-check.p12"
          key_check_log="$RUNNER_TEMP/phonehaul-signing-check.log"
          if ! keytool -importkeystore \
            -srckeystore "$keystore" \
            -srcstorepass:env ANDROID_STORE_PASSWORD \
            -srcalias "$ANDROID_KEY_ALIAS" \
            -srckeypass:env ANDROID_KEY_PASSWORD \
            -destkeystore "$key_check" \
            -deststoretype PKCS12 \
            -deststorepass:env ANDROID_STORE_PASSWORD \
            -destkeypass:env ANDROID_STORE_PASSWORD \
            -noprompt >"$key_check_log" 2>&1; then
            cat "$key_check_log"
            echo "Android signing check failed: verify the keystore file, alias, store password, and key password secrets."
            exit 1
          fi
          rm -f "$key_check" "$key_check_log"
          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
      - name: Build signed release APK and app bundle
        working-directory: android
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: phonehaul-android-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      # Automatic Play upload (optional): only runs when the service-account
      # secret exists. Internal track only; production promotion stays manual.
      - name: Write Play service account key
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/play-service-account.json"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$key_file"
          chmod 600 "$key_file"
          echo "PLAY_SERVICE_ACCOUNT_FILE=$key_file" >> "$GITHUB_ENV"
      - name: Upload AAB to Play internal track
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ env.PLAY_SERVICE_ACCOUNT_FILE }}
          packageName: org.phonehaul.app
          releaseFile: android/app/build/outputs/bundle/release/*.aab
          track: internal
          # Upload + attach to the internal track, but do not submit for
          # review; the human promotes it from Play Console (§6.6).
          changesNotSentForReview: 'true'
      - name: Note skipped Play upload
        if: env.PLAY_SERVICE_ACCOUNT_JSON == ''
        run: echo "PLAY_SERVICE_ACCOUNT_JSON not set; skipping automatic Play upload (artifact only)." >> "$GITHUB_STEP_SUMMARY"
