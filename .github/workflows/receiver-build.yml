name: PhoneHaul builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Verify Node.js version
        run: node -e "console.log(process.version); if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build APK and run unit tests
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v6
        with:
          name: phonehaul-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  sea:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          # Re-enable these standalone Windows SEA builds after the Tauri
          # Windows packaging path has been tested and stabilized.
          # - runner: windows-2025
          #   platform: windows
          #   arch: x64
          # - runner: windows-11-arm
          #   platform: windows
          #   arch: arm64
          # macOS releases use the Tauri DMGs in the desktop job below.
          # - runner: macos-15-intel
          #   platform: macos
          #   arch: x64
          # - runner: macos-15
          #   platform: macos
          #   arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Verify Node.js version
        run: node -e "console.log(process.version); if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
      - name: Install receiver dependencies
        run: npm install --prefix receiver
      - name: Run receiver tests
        run: npm --prefix receiver test
      - name: Install AppImage tooling
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          case "${{ matrix.arch }}" in
            x64) APPIMAGE_ARCH=x86_64 ;;
            arm64) APPIMAGE_ARCH=aarch64 ;;
          esac
          curl --fail --location "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${APPIMAGE_ARCH}.AppImage" --output "$RUNNER_TEMP/appimagetool"
          curl --fail --location "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-${APPIMAGE_ARCH}" --output "$RUNNER_TEMP/appimage-runtime"
          chmod +x "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimage-runtime"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME=$RUNNER_TEMP/appimage-runtime" >> "$GITHUB_ENV"
      - name: Build AppImage and standalone executable
        if: matrix.platform == 'linux'
        run: npm --prefix receiver run package:appimage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - name: Smoke test standalone executable
        run: npm --prefix receiver run smoke:sea
      - uses: actions/upload-artifact@v6
        with:
          name: phonehaul-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/phonehaul-${{ matrix.platform }}-${{ matrix.arch }}*
            dist/PhoneHaul-*.AppImage
          if-no-files-found: error

  desktop:
    name: Tauri desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            bundles: appimage
            # To publish a Debian package too, use `appimage,deb` and add the
            # bundle/deb path below.
            artifact-path: desktop/src-tauri/target/release/bundle/appimage/PhoneHaul_*.AppImage
            artifact-name: phonehaul-desktop-linux
          - platform: windows
            runner: windows-2025
            bundles: nsis
            artifact-path: desktop/src-tauri/target/release/bundle/nsis/*
            artifact-name: phonehaul-desktop-windows
          - platform: macos-intel
            runner: macos-15-intel
            arch: x64
            bundles: dmg
            artifact-path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
            artifact-name: phonehaul-desktop-macos-x64
          - platform: macos-arm64
            runner: macos-15
            arch: arm64
            bundles: dmg
            artifact-path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
            artifact-name: phonehaul-desktop-macos-arm64
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.platform == 'macos-intel' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            receiver/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential curl wget file libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libldap2-dev libfuse2 patchelf
      - name: Install NSIS
        if: matrix.platform == 'windows'
        run: |
          choco install nsis --yes --no-progress
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (!(Test-Path $nsis)) { throw "NSIS installation not found at $nsis" }
          Add-Content $env:GITHUB_PATH $nsis
      - name: Install receiver dependencies
        if: matrix.platform == 'linux'
        run: npm ci --prefix receiver
      - name: Install desktop dependencies
        if: matrix.platform == 'linux'
        run: npm ci --prefix desktop
      - name: Build Linux Tauri bundles
        if: matrix.platform == 'linux'
        run: npm run build -- --bundles ${{ matrix.bundles }}
        working-directory: desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - name: Build Windows Tauri installer
        if: matrix.platform == 'windows'
        run: bash scripts/build-desktop-windows.sh
        shell: bash
      - name: Build macOS Tauri disk image
        if: startsWith(matrix.platform, 'macos-')
        run: bash scripts/build-desktop-macos.sh
      - name: Smoke test macOS receiver sidecar
        if: startsWith(matrix.platform, 'macos-')
        run: npm --prefix receiver run smoke:sea
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
