name: PhoneHaul builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Verify Node.js version
        run: node -e "console.log(process.version); if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build APK and run unit tests
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v6
        with:
          name: phonehaul-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-release:
    name: Android signed release packages
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_STORE_PASSWORD:?Missing ANDROID_STORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          keystore="$RUNNER_TEMP/phonehaul-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
      - name: Build signed APK and Play bundle
        working-directory: android
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@v6
        with:
          name: phonehaul-android-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  sea:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: windows-2025
            platform: windows
            arch: x64
          - runner: windows-11-arm
            platform: windows
            arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: x64
          - runner: macos-15
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.platform == 'macos' && matrix.arch == 'x64' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Verify Node.js version
        run: node -e "console.log(process.version); if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
      - name: Install receiver dependencies
        run: npm install --prefix receiver
      - name: Run receiver tests
        run: npm --prefix receiver test
      - name: Build standalone executable
        if: matrix.platform != 'linux'
        run: npm --prefix receiver run package:sea
      - name: Install AppImage tooling
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          case "${{ matrix.arch }}" in
            x64) APPIMAGE_ARCH=x86_64 ;;
            arm64) APPIMAGE_ARCH=aarch64 ;;
          esac
          curl --fail --location "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${APPIMAGE_ARCH}.AppImage" --output "$RUNNER_TEMP/appimagetool"
          curl --fail --location "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-${APPIMAGE_ARCH}" --output "$RUNNER_TEMP/appimage-runtime"
          chmod +x "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimage-runtime"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME=$RUNNER_TEMP/appimage-runtime" >> "$GITHUB_ENV"
      - name: Build AppImage and standalone executable
        if: matrix.platform == 'linux'
        run: npm --prefix receiver run package:appimage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - name: Smoke test standalone executable
        run: npm --prefix receiver run smoke:sea
      - uses: actions/upload-artifact@v6
        with:
          name: phonehaul-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/phonehaul-${{ matrix.platform }}-${{ matrix.arch }}*
            dist/PhoneHaul-*.AppImage
          if-no-files-found: error
