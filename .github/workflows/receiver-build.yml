name: PhoneHaul builds
on:
  push:
    branches: [main]
    tags: ['v[0-9]*.[0-9]*.[0-9]*', '!v*-dev.*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && 'official-release-lifecycle' || format('ci-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - name: Validate exact event source and official tag
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "source=$GITHUB_SHA; PR head=${{ github.event.pull_request.head.sha }}; PR base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            [[ "$version" != *-* ]]
            node scripts/shared/official.js validate "$version"
            git merge-base --is-ancestor HEAD origin/main
            node scripts/shared/official.js reserved "$version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
  builds:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/platform-builds.yml
    with:
      ref: ${{ github.sha }}
      official: ${{ startsWith(github.ref, 'refs/tags/v') }}
      release: ${{ startsWith(github.ref, 'refs/tags/v') }}
  android-signed:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    uses: ./.github/workflows/android-signed-release.yml
    with:
      ref: ${{ github.ref }}
    secrets: inherit
  stage:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.validate.result == 'success' && needs.builds.result == 'success' }}
    needs: [validate, builds, android-signed]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets
      - name: Verify all mandatory targets and transport hashes
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: scripts/assemble-release-assets.sh "$RELEASE_VERSION" release-assets assets-release
      - name: Generate notes and stage verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          scripts/release-notes.sh "$RELEASE_VERSION" RELEASE_NOTES.md
          node scripts/shared/publish-release.js "$RELEASE_VERSION" assets-release RELEASE_NOTES.md stage
          echo "Review draft notes and release-manifest.json before approving release-publication: https://github.com/$GITHUB_REPOSITORY/releases" >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: [stage, validate]
    environment: release-publication
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets
      - name: Verify all mandatory targets and transport hashes
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: scripts/assemble-release-assets.sh "$RELEASE_VERSION" release-assets assets-release
      - name: Confirm approval controls and publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          # Fail closed when the environment was auto-created without reviewers.
          gh api "repos/$GITHUB_REPOSITORY/environments/release-publication" --jq '.protection_rules | any(.type == "required_reviewers")' | grep -qx true
          PHONEHAUL_NOTES_REVIEWED=1 node scripts/shared/publish-release.js "$RELEASE_VERSION" assets-release RELEASE_NOTES.md
